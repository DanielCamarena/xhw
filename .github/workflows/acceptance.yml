name: Offline acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DASK_NUM_WORKERS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - shell: bash
        run: python -m pip install "$(find dist -name '*.whl')[dev]"
      - run: python -c "import pathlib, xhw; p = pathlib.Path(xhw.__file__).resolve(); assert not p.is_relative_to(pathlib.Path.cwd()); print(p)"
      - run: python -m pytest
      - run: python -m ruff check .
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - shell: bash
        run: python -m pip install "$(find dist -name '*.whl')" 'numpy==1.24.0' 'scipy==1.11.0' 'xarray==2023.1.0' 'pandas<2'
      - run: python examples/quickstart.py
      - run: python -m pip install pytest
      - run: python -m pytest --noconftest tests/test_intensity_contract.py
      - run: python -m pip check
  tutorials:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DASK_NUM_WORKERS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]' -r examples/requirements-interactive.txt build twine
      - run: python examples/execute_notebooks.py --output-dir results/notebooks
      - run: python tools/validate_docs.py
      - run: python -m build
      - run: python tools/audit_package.py --dist-dir dist
      - run: python -m twine check dist/*
